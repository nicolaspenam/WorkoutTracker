name: PR preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  deployments: read

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        if: github.event.action != 'closed'
        run: |
          mkdir -p site/icons
          cp index.html styles.css app.js logic.js manifest.webmanifest sw.js favicon.ico site/
          cp icons/*.png site/icons/
          touch site/.nojekyll

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site
          # Pages already serves the main branch, so previews live there
          # under /pr-preview/pr-<number>/ without changing repo settings.
          preview-branch: main
          umbrella-dir: pr-preview
          wait-for-pages-deployment: true
          qr-code: true
