<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Workout Tracker</h1>
      <p class="subtitle" id="phase-label">Build your workout</p>
    </header>

    <!-- Phase 1: Build workout -->
    <section id="build-phase" class="phase">
      <div class="card">
        <label for="exercise-select" class="label">Add an exercise</label>
        <div class="add-row">
          <select id="exercise-select" class="select">
            <option value="">Choose an exercise…</option>
          </select>
          <button type="button" id="add-exercise-btn" class="btn btn-secondary">Add</button>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">Your workout</h2>
        <ul id="exercise-list" class="exercise-list">
          <li class="empty-state" id="empty-list-msg">No exercises added yet.</li>
        </ul>
      </div>

      <button type="button" id="start-workout-btn" class="btn btn-primary btn-full" disabled>
        Start Workout
      </button>
    </section>

    <!-- Phase 2: Track sets -->
    <section id="track-phase" class="phase hidden">
      <div id="sets-container"></div>

      <button type="button" id="finish-workout-btn" class="btn btn-primary btn-full">
        Finish Workout
      </button>
    </section>

    <!-- Phase 3: Summary -->
    <section id="summary-phase" class="phase hidden">
      <div class="card summary-card">
        <div class="summary-icon" aria-hidden="true">✓</div>
        <h2>Workout complete!</h2>
        <p class="summary-meta" id="summary-meta"></p>
        <div id="summary-details"></div>
      </div>

      <button type="button" id="new-workout-btn" class="btn btn-primary btn-full">
        Start New Workout
      </button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
